<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<title>Mis Finanzas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:Georgia,serif;background:#0f0f14;color:#e8e4dc;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
input,select,button{font-family:sans-serif;outline:none;-webkit-appearance:none;appearance:none;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.5;}
::-webkit-scrollbar{display:none;}
#app{max-width:640px;margin:0 auto;}
.hdr{background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #2a2a4a;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top));position:sticky;top:0;z-index:100;}
.hdr-i{display:flex;justify-content:space-between;align-items:center;}
.hdr-s{font-size:11px;letter-spacing:3px;color:#7c7c9a;text-transform:uppercase;margin-bottom:2px;font-family:sans-serif;}
.hdr-t{font-size:22px;font-weight:bold;color:#c9b8ff;}
.hsel{background:#1e1e3a;border:1px solid #3a3a5c;color:#e8e4dc;border-radius:8px;padding:6px 8px;font-size:13px;}
.nav{background:#12121e;border-bottom:1px solid #2a2a4a;overflow-x:auto;position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:99;}
.nav-i{display:flex;min-width:max-content;}
.nb{padding:10px 12px;border:none;background:transparent;white-space:nowrap;color:#6c6c8a;font-size:10px;cursor:pointer;border-bottom:2px solid transparent;font-family:sans-serif;}
.nb.on{color:#c9b8ff;border-bottom-color:#c9b8ff;font-weight:600;}
.nb .ico{font-size:16px;display:block;}
.con{padding:16px 14px 100px;}
.bal{border-radius:16px;padding:24px;margin-bottom:16px;text-align:center;}
.bal.pos{background:linear-gradient(135deg,#0d2b1e,#1a4a2e);border:1px solid #2a6a4a;}
.bal.neg{background:linear-gradient(135deg,#2b0d0d,#4a1a1a);border:1px solid #6a2a2a;}
.bal-l{font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:sans-serif;}
.bal-a{font-size:40px;font-weight:bold;}
.bal-n{font-size:13px;color:#8a8aaa;margin-top:8px;font-family:sans-serif;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.card{border-radius:12px;padding:14px 12px;}
.cl{font-size:10px;letter-spacing:1.5px;color:#6c6c8a;text-transform:uppercase;margin-bottom:6px;font-family:sans-serif;}
.cv{font-size:18px;font-weight:bold;}
.mc{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;padding:10px 8px;text-align:center;}
.ml{font-size:10px;color:#6c6c8a;font-family:sans-serif;margin-bottom:4px;}
.mv{font-size:15px;font-weight:bold;}
.pan{background:#12121e;border:1px solid #2a2a4a;border-radius:12px;padding:16px;margin-bottom:14px;}
.pt{font-size:11px;letter-spacing:2px;color:#7c7c9a;text-transform:uppercase;margin-bottom:12px;font-family:sans-serif;}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.sh-t{font-size:20px;font-weight:bold;color:#c9b8ff;}
.sh-v{font-size:17px;font-weight:bold;}
.gt{font-size:10px;letter-spacing:2px;color:#5a5a7a;text-transform:uppercase;margin-top:18px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1e1e3a;font-family:sans-serif;}
.ir{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a1a2e;}
.il{font-size:14px;color:#c8c4d0;flex:1;font-family:sans-serif;}
.ir-r{display:flex;align-items:center;gap:4px;}
.sym{color:#5a5a7a;font-size:14px;}
.inum{width:100px;background:#1a1a2e;border:1px solid #2a2a4a;color:#e8e4dc;border-radius:8px;padding:7px 10px;font-size:14px;text-align:right;}
.fi{width:100%;background:#1a1a2e;border:1px solid #3a3a5c;color:#e8e4dc;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:8px;display:block;}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:sans-serif;margin-top:4px;}
.btn-pu{background:#c9b8ff;color:#0f0f14;}
.btn-pk{background:#ff9fd0;color:#0f0f14;}
.btn-ye{background:#ffd580;color:#0f0f14;}
.btn-bl{background:#80d8ff;color:#0f0f14;}
.tbar{margin-top:8px;background:#1a1a2e;border-radius:10px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;}
.tl{font-size:13px;color:#8a8aaa;font-family:sans-serif;}
.tv{font-size:19px;font-weight:bold;}
.sr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sl{font-size:13px;color:#8a8aaa;font-family:sans-serif;}
.sv{font-size:15px;font-weight:500;}
.sv.bold{font-size:18px;font-weight:bold;}
.txi{background:#12121e;border:1px solid #2a2a4a;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.tt{font-size:13px;color:#c8c4d0;font-family:sans-serif;font-weight:600;}
.td{font-size:11px;color:#5a5a7a;margin-top:2px;font-family:sans-serif;}
.ta{font-size:15px;font-weight:bold;}
.txr{display:flex;align-items:center;gap:10px;}
.del{background:none;border:none;color:#4a4a6a;cursor:pointer;font-size:16px;padding:0 4px;width:auto;}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.cbt{padding:8px 4px;border-radius:8px;border:none;cursor:pointer;font-family:sans-serif;font-size:11px;text-align:center;width:auto;}
.cbt .em{font-size:18px;display:block;}
.cbt.on{background:#2a1a4a;color:#c9b8ff;outline:1px solid #c9b8ff;}
.cbt.off{background:#1a1a2e;color:#6c6c8a;outline:1px solid #2a2a4a;}
.fb{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.fbt{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;white-space:nowrap;font-family:sans-serif;font-size:12px;width:auto;}
.fbt.on{background:#2a1a4a;color:#c9b8ff;outline:1px solid #c9b8ff;}
.fbt.off{background:#1a1a2e;color:#6c6c8a;outline:1px solid #2a2a4a;}
.pb{background:#1a1a2e;border-radius:4px;height:6px;overflow:hidden;}
.pf{height:100%;border-radius:4px;}
.db{display:flex;border-radius:6px;overflow:hidden;height:12px;margin-bottom:10px;}
.legs{display:flex;gap:14px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;font-family:sans-serif;}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;}
.exrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a1a2e;}
.ex-l{font-size:14px;color:#c8c4d0;flex:1;font-family:sans-serif;}
.ex-r{display:flex;align-items:center;gap:6px;}
.aer{display:flex;gap:8px;margin-top:12px;}
.aer input{flex:1;background:#1a1a2e;border:1px solid #3a3a5c;color:#e8e4dc;border-radius:8px;padding:10px 12px;font-size:14px;}
.aeb{padding:10px 16px;background:#c9b8ff;color:#0f0f14;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:18px;flex-shrink:0;width:auto;}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.flg label{font-size:10px;color:#5a5a7a;font-family:sans-serif;margin-bottom:4px;display:block;}
.sep{border-top:1px solid #2a2a4a;margin-top:10px;padding-top:10px;}
.csr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a1a2e;}
.csl{font-size:13px;color:#c8c4d0;font-family:sans-serif;}
.csv{font-size:14px;font-weight:bold;color:#ffd580;}
.empty{text-align:center;color:#4a4a6a;padding:28px;font-size:14px;font-family:sans-serif;}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;border:none;border-radius:50%;width:56px;height:56px;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:all 0.3s;z-index:200;background:#c9b8ff;color:#0f0f14;}
.etog{display:flex;gap:8px;margin-bottom:10px;}
.etog button{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;width:auto;}
.prev{background:#1a1a2e;border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.prev-l{font-size:12px;color:#7c7c9a;font-family:sans-serif;}
.prev-v{font-size:18px;color:#ff9fd0;font-weight:bold;}
.info-box{background:#1a1a2e;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-family:sans-serif;font-size:12px;color:#7c7c9a;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-i">
      <div>
        <div class="hdr-s">Control de Gastos</div>
        <div class="hdr-t">Mis Finanzas</div>
      </div>
      <div style="display:flex;gap:8px">
        <select class="hsel" id="selMonth"></select>
        <select class="hsel" id="selYear"></select>
      </div>
    </div>
  </div>
  <div class="nav"><div class="nav-i" id="navBar"></div></div>
  <div class="con" id="content"></div>
  <button class="fab" id="fabBtn" onclick="doSave()">💾</button>
</div>
<script>
const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const now=new Date();
const FIXED=[
  {id:"alquiler",l:"Alquiler"},{id:"expensas",l:"Expensas"},{id:"luz",l:"Luz"},
  {id:"arqui",l:"Serv. Municipal (Arqui)"},{id:"tarjetas",l:"Tarjetas"},{id:"prestamo",l:"Préstamo"},
  {id:"celular",l:"Celular"},{id:"internet",l:"Internet"},{id:"transporte",l:"Transporte"},
  {id:"seguro",l:"Seguro"},{id:"hbo",l:"HBO Max"},{id:"netflix",l:"Netflix"},
  {id:"spotify",l:"Spotify"},{id:"amazon",l:"Amazon Prime"},
];
const VCATS=[
  {id:"comida",l:"Comida",e:"🍽️"},{id:"gimnasio",l:"Gimnasio",e:"💪"},
  {id:"ocio",l:"Ocio",e:"🎮"},{id:"salidas",l:"Salidas",e:"🍻"},
  {id:"ropa",l:"Ropa",e:"👗"},{id:"belleza",l:"Belleza",e:"✨"},
  {id:"regalos",l:"Regalos",e:"🎁"},{id:"vacaciones",l:"Vacaciones",e:"✈️"},
  {id:"dolares",l:"Dólares",e:"💵"},{id:"otro_var",l:"Otro",e:"📦"},
];
const ECATS=[
  {id:"ventas",l:"Ventas / Ingresos"},{id:"compras",l:"Compras / Insumos"},
  {id:"publicidad",l:"Publicidad"},{id:"servicios",l:"Servicios"},{id:"otros_emp",l:"Otros"},
];
const ICATS=[
  {id:"trabajo_familiar",l:"Trabajo Familiar"},
  {id:"freelance",l:"Freelance"},{id:"venta",l:"Venta"},{id:"otro",l:"Otro"},
];
const TARJETAS=["BBVA","Naranja","Galicia"];
const TCOLORS={"BBVA":"#00a3e0","Naranja":"#ff6600","Galicia":"#cc0000"};
const TABS=[
  {id:"dashboard",l:"Resumen",i:"📊"},{id:"fixed",l:"Fijos",i:"📌"},
  {id:"cuotas",l:"Cuotas",i:"💳"},{id:"variable",l:"Variables",i:"🛒"},
  {id:"income",l:"Ingresos",i:"💰"},{id:"emp",l:"Emprendimiento",i:"🚀"},
  {id:"anual",l:"Anual",i:"📈"},
];

let S={
  month:now.getMonth(),year:now.getFullYear(),tab:"dashboard",
  dailyCat:"comida",dailyAmt:"",dailyDesc:"",dailyUSD:"",dailyDate:now.toISOString().slice(0,10),dailyFilter:"all",
  empType:"income",
  nCDesc:"",nCTar:"BBVA",nCTotal:"",nCNum:"1",nCDate:now.toISOString().slice(0,10),
  nIcat:"trabajo_familiar",nIdesc:"",nIamt:"",nIdate:now.toISOString().slice(0,10),
  nEcat:"ventas",nEdesc:"",nEamt:"",
  extraLabel:"",
  data:null
};

function sk(m,y){return `gastos_v3_${y}_${m}`;}
function empty(){
  const f={};FIXED.forEach(e=>f[e.id]="");
  return{fixed:f,fixedExtras:[],dailyExpenses:[],sueldo:"",varIncomeTransactions:[],empTransactions:[],cuotas:[]};
}
function load(m,y){
  m=m!==undefined?m:S.month; y=y!==undefined?y:S.year;
  try{const r=localStorage.getItem(sk(m,y));if(r)return Object.assign(empty(),JSON.parse(r));}catch(e){}
  return empty();
}
function save(){try{localStorage.setItem(sk(S.month,S.year),JSON.stringify(S.data));}catch(e){}}
function fmt(n){const v=parseFloat(n)||0;return"$"+v.toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});}
function sumObj(o){return Object.values(o).reduce((a,v)=>a+(parseFloat(v)||0),0);}
function fmtD(d){try{return new Date(d+"T12:00:00").toLocaleDateString("es-AR");}catch(e){return d||"";}}

function tots(d){
  d=d||S.data;
  const tf=sumObj(d.fixed)+(d.fixedExtras||[]).reduce((a,e)=>a+(parseFloat(e.value)||0),0);
  const tv=(d.dailyExpenses||[]).reduce((a,e)=>a+e.amount,0);
  const tc=(d.cuotas||[]).filter(c=>c.actual<=c.cuotas).reduce((a,c)=>a+(c.total/c.cuotas),0);
  const te=tf+tv+tc;
  const su=parseFloat(d.sueldo)||0;
  const vi=(d.varIncomeTransactions||[]).reduce((a,t)=>a+t.amount,0);
  const ei=(d.empTransactions||[]).filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0);
  const ee=(d.empTransactions||[]).filter(t=>t.type==="expense").reduce((a,t)=>a+t.amount,0);
  const eb=ei-ee;
  const ti=su+vi+eb;
  const bl=ti-te;
  return{tf,tv,tc,te,su,vi,ti,bl,ei,ee,eb};
}

function render(){
  const sm=document.getElementById("selMonth");
  const sy=document.getElementById("selYear");
  sm.innerHTML=MONTHS.map((m,i)=>`<option value="${i}"${i===S.month?" selected":""}>${m}</option>`).join("");
  sy.innerHTML=[2024,2025,2026,2027].map(y=>`<option value="${y}"${y===S.year?" selected":""}>${y}</option>`).join("");
  sm.onchange=e=>{S.month=+e.target.value;S.data=load();render();};
  sy.onchange=e=>{S.year=+e.target.value;S.data=load();render();};
  document.getElementById("navBar").innerHTML=TABS.map(t=>
    `<button class="nb ${S.tab===t.id?"on":""}" onclick="go('${t.id}')"><span class="ico">${t.i}</span>${t.l}</button>`
  ).join("");
  const t=tots();
  const map={dashboard:dash,fixed:fixedTab,cuotas:cuotasTab,variable:varTab,income:incomeTab,emp:empTab,anual:anualTab};
  document.getElementById("content").innerHTML=(map[S.tab]||dash)(t);
  window.scrollTo(0,0);
}
function go(tab){S.tab=tab;render();}
function doSave(){save();const f=document.getElementById("fabBtn");f.textContent="✓";f.style.background="#0d2b1e";f.style.color="#7fffb0";setTimeout(()=>{f.textContent="💾";f.style.background="#c9b8ff";f.style.color="#0f0f14";},2000);}

// ── DASHBOARD ──
function dash(t){
  const ct=VCATS.map(c=>({...c,tot:(S.data.dailyExpenses||[]).filter(e=>e.category===c.id).reduce((a,e)=>a+e.amount,0)})).filter(c=>c.tot>0);
  return `
  <div style="font-size:13px;color:#7c7c9a;text-align:center;margin-bottom:16px;letter-spacing:1px;font-family:sans-serif">${MONTHS[S.month].toUpperCase()} ${S.year}</div>
  <div class="bal ${t.bl>=0?"pos":"neg"}">
    <div class="bal-l" style="color:${t.bl>=0?"#5aaf7a":"#af5a5a"}">Balance del Mes</div>
    <div class="bal-a" style="color:${t.bl>=0?"#7fffb0":"#ff8080"}">${fmt(t.bl)}</div>
    <div class="bal-n">${t.bl>=0?"✓ Estás en positivo":"⚠ Gastos mayores a ingresos"}</div>
  </div>
  <div class="g2">
    ${cd("Ingresos Totales",fmt(t.ti),"#7fffb0","#0d2020")}
    ${cd("Gastos Totales",fmt(t.te),"#ff8c8c","#1a0d0d")}
    ${cd("Gastos Fijos",fmt(t.tf),"#c9b8ff","#160d2a")}
    ${cd("Gastos Variables",fmt(t.tv),"#ffd580","#1a1600")}
    ${cd("Cuotas este mes",fmt(t.tc),"#ff9fd0","#1a0d16")}
    ${cd("Ing. Variables",fmt(t.vi),"#80d8ff","#0d1820")}
  </div>
  ${ct.length?`<div class="pan"><div class="pt">🛒 Variables por categoría</div>${ct.map(c=>`<div class="csr"><span class="csl">${c.e} ${c.l}</span><span class="csv">${fmt(c.tot)}</span></div>`).join("")}</div>`:""}
  <div class="pan"><div class="pt">🚀 SOMOS Porfa</div>
    <div class="g3">
      <div class="mc"><div class="ml" style="color:#5a8a5a">Ingresos</div><div class="mv" style="color:#7fffb0">${fmt(t.ei)}</div></div>
      <div class="mc"><div class="ml" style="color:#8a5a5a">Gastos</div><div class="mv" style="color:#ff8c8c">${fmt(t.ee)}</div></div>
      <div class="mc"><div class="ml">Neto</div><div class="mv" style="color:${t.eb>=0?"#7fffb0":"#ff8c8c"}">${fmt(t.eb)}</div></div>
    </div>
  </div>
  ${t.te>0?`<div class="pan"><div class="pt">Distribución</div>
    <div class="db">
      <div style="width:${(t.tf/t.te*100).toFixed(1)}%;background:#c9b8ff"></div>
      <div style="width:${(t.tc/t.te*100).toFixed(1)}%;background:#ff9fd0"></div>
      <div style="width:${(t.tv/t.te*100).toFixed(1)}%;background:#ffd580"></div>
    </div>
    <div class="legs">
      <div class="leg"><span class="dot" style="background:#c9b8ff"></span>Fijos ${(t.tf/t.te*100).toFixed(0)}%</div>
      <div class="leg"><span class="dot" style="background:#ff9fd0"></span>Cuotas ${(t.tc/t.te*100).toFixed(0)}%</div>
      <div class="leg"><span class="dot" style="background:#ffd580"></span>Variables ${(t.tv/t.te*100).toFixed(0)}%</div>
    </div>
  </div>`:""}`;
}
function cd(label,value,color,bg){return `<div class="card" style="background:${bg};border:1px solid ${color}22"><div class="cl">${label}</div><div class="cv" style="color:${color}">${value}</div></div>`;}

// ── FIJOS ──
function fixedTab(t){
  const ex=S.data.fixedExtras||[];
  const groups=[
    {title:"Servicios del Hogar",ids:["alquiler","expensas","luz","arqui"]},
    {title:"Deudas y Compromisos",ids:["tarjetas","prestamo"]},
    {title:"Conectividad y Movilidad",ids:["celular","internet","transporte","seguro"]},
    {title:"Suscripciones",ids:["hbo","netflix","spotify","amazon"]},
  ];
  return `
  <div class="sh"><div class="sh-t">📌 Gastos Fijos</div><div class="sh-v">${fmt(t.tf)}</div></div>
  ${groups.map(g=>`<div class="gt">${g.title}</div>${g.ids.map(id=>{
    const item=FIXED.find(e=>e.id===id);
    return `<div class="ir"><div class="il">${item.l}</div><div class="ir-r"><span class="sym">$</span><input class="inum" type="number" placeholder="0" value="${S.data.fixed[id]||""}" oninput="S.data.fixed['${id}']=this.value;save()"></div></div>`;
  }).join("")}`).join("")}
  <div class="gt">Otros Fijos</div>
  ${ex.map(e=>`<div class="exrow"><div class="ex-l">${e.label}</div><div class="ex-r"><span class="sym">$</span><input class="inum" type="number" placeholder="0" value="${e.value||""}" oninput="updEx(${e.id},this.value)"><button class="del" onclick="delEx(${e.id})">✕</button></div></div>`).join("")}
  <div class="aer">
    <input type="text" placeholder="Nombre del gasto..." value="${S.extraLabel}" oninput="S.extraLabel=this.value" onkeydown="if(event.key==='Enter')addEx()">
    <button class="aeb" onclick="addEx()">+</button>
  </div>
  <div class="tbar"><span class="tl">Total Gastos Fijos</span><span class="tv" style="color:#c9b8ff">${fmt(t.tf)}</span></div>`;
}
function addEx(){if(!S.extraLabel.trim())return;S.data.fixedExtras.push({id:Date.now(),label:S.extraLabel.trim(),value:""});S.extraLabel="";save();render();}
function updEx(id,v){const e=S.data.fixedExtras.find(e=>e.id===id);if(e){e.value=v;save();}}
function delEx(id){S.data.fixedExtras=S.data.fixedExtras.filter(e=>e.id!==id);save();render();}

// ── CUOTAS ──
function cuotasTab(t){
  const activas=(S.data.cuotas||[]).filter(c=>c.actual<=c.cuotas);
  const saldadas=(S.data.cuotas||[]).filter(c=>c.actual>c.cuotas);
  const byTar=TARJETAS.map(tar=>({
    tar,color:TCOLORS[tar]||"#c9b8ff",
    items:activas.filter(c=>c.tarjeta===tar),
    mes:activas.filter(c=>c.tarjeta===tar).reduce((a,c)=>a+(c.total/c.cuotas),0),
    deuda:activas.filter(c=>c.tarjeta===tar).reduce((a,c)=>a+(c.total-(c.total/c.cuotas)*(c.actual-1)),0),
  })).filter(x=>x.items.length>0);

  const prev=S.nCTotal&&S.nCNum?fmt(parseFloat(S.nCTotal)/parseInt(S.nCNum)):null;

  return `
  <div class="sh"><div class="sh-t">💳 Tarjetas y Cuotas</div><div class="sh-v">${fmt(t.tc)}</div></div>

  ${byTar.map(x=>`
    <div style="background:#12121e;border:1px solid ${x.color}44;border-radius:12px;padding:14px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:15px;font-weight:bold;color:${x.color};font-family:sans-serif;">💳 ${x.tar}</div>
        <div style="text-align:right;">
          <div style="font-size:17px;font-weight:bold;color:#ff9fd0;">${fmt(x.mes)}<span style="font-size:11px;color:#5a5a7a;font-weight:400;">/mes</span></div>
          <div style="font-size:11px;color:#5a5a7a;font-family:sans-serif;">Deuda total: ${fmt(x.deuda)}</div>
        </div>
      </div>
      ${x.items.map(c=>{
        const m=c.total/c.cuotas;const p=Math.min(c.actual/c.cuotas*100,100);
        return `<div style="border-top:1px solid #1e1e3a;padding-top:8px;margin-top:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <div><div style="font-size:13px;color:#c8c4d0;font-family:sans-serif;font-weight:600;">${c.desc}</div>
            <div style="font-size:10px;color:#5a5a7a;font-family:sans-serif;">Cuota ${c.actual}/${c.cuotas} · Total ${fmt(c.total)}</div></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:14px;font-weight:bold;color:#ff9fd0;">${fmt(m)}</div>
              <button class="del" onclick="delCuota(${c.id})">✕</button>
            </div>
          </div>
          <div class="pb"><div class="pf" style="width:${p.toFixed(1)}%;background:linear-gradient(90deg,${x.color},#c9b8ff);"></div></div>
          <div style="font-size:10px;color:#5a5a7a;text-align:right;margin-top:3px;font-family:sans-serif;">${p.toFixed(0)}% · Restan ${fmt(c.total-(m*(c.actual-1)))}</div>
        </div>`;
      }).join("")}
    </div>`).join("")}

  <div class="pan"><div class="pt">+ Nueva Compra</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      ${TARJETAS.map(t=>`<button onclick="S.nCTar='${t}';render()" style="flex:1;padding:8px 4px;border-radius:8px;border:none;cursor:pointer;font-family:sans-serif;font-size:12px;font-weight:600;width:auto;background:${S.nCTar===t?(TCOLORS[t]+"33"):"#1a1a2e"};color:${S.nCTar===t?(TCOLORS[t]):"#6c6c8a"};outline:${S.nCTar===t?`1px solid ${TCOLORS[t]}`:"1px solid #2a2a4a"};">${t}</button>`).join("")}
    </div>
    <input class="fi" type="text" placeholder="Descripción (ej: Zapatillas, TV...)" value="${S.nCDesc}" oninput="S.nCDesc=this.value">
    <div class="g2f">
      <div class="flg"><label>MONTO TOTAL $</label><input class="fi" style="margin-bottom:0" type="number" placeholder="0" value="${S.nCTotal}" oninput="S.nCTotal=this.value;render()"></div>
      <div class="flg"><label>CUOTAS</label>
        <select class="fi" style="margin-bottom:0" onchange="S.nCNum=this.value;render()">
          ${[1,2,3,6,9,12,18,24].map(n=>`<option value="${n}"${S.nCNum==n?" selected":""}>${n===1?"1 (pago único)":n+" cuotas"}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="flg"><label>FECHA DE COMPRA</label><input class="fi" type="date" value="${S.nCDate}" oninput="S.nCDate=this.value"></div>
    ${prev?`<div class="prev"><span class="prev-l">Cuota mensual:</span><span class="prev-v">${prev}</span></div>`:""}
    <button class="btn btn-pk" onclick="addCuota()">Agregar Compra</button>
  </div>

  ${saldadas.length?`<div class="pan" style="opacity:0.5"><div class="pt">✓ Saldadas</div>
    ${saldadas.map(c=>`<div class="csr"><span class="csl">${c.tarjeta||""} · ${c.desc}</span><button class="del" onclick="delCuota(${c.id})">✕</button></div>`).join("")}
  </div>`:""}
  <div class="tbar"><span class="tl">Total tarjetas este mes</span><span class="tv" style="color:#ff9fd0">${fmt(t.tc)}</span></div>`;
}
function addCuota(){
  if(!S.nCDesc||!S.nCTotal||!S.nCNum)return;
  const purchase=new Date(S.nCDate+"T12:00:00");
  const current=new Date(S.year,S.month,1);
  const diff=(current.getFullYear()-purchase.getFullYear())*12+(current.getMonth()-purchase.getMonth());
  const actual=Math.min(Math.max(diff+1,1),parseInt(S.nCNum));
  S.data.cuotas.push({id:Date.now(),desc:S.nCDesc,tarjeta:S.nCTar,total:parseFloat(S.nCTotal),cuotas:parseInt(S.nCNum),actual,purchaseDate:S.nCDate});
  S.nCDesc="";S.nCTotal="";S.nCNum="1";S.nCDate=now.toISOString().slice(0,10);
  save();render();
}
function delCuota(id){S.data.cuotas=S.data.cuotas.filter(c=>c.id!==id);save();render();}

// ── VARIABLES ──
function varTab(t){
  const ct=VCATS.map(c=>({...c,tot:(S.data.dailyExpenses||[]).filter(e=>e.category===c.id).reduce((a,e)=>a+e.amount,0)})).filter(c=>c.tot>0);
  const used=VCATS.filter(c=>(S.data.dailyExpenses||[]).some(e=>e.category===c.id));
  const list=S.dailyFilter==="all"?[...(S.data.dailyExpenses||[])].reverse():[...(S.data.dailyExpenses||[])].filter(e=>e.category===S.dailyFilter).reverse();
  return `
  <div class="sh"><div class="sh-t">🛒 Variables</div><div class="sh-v">${fmt(t.tv)}</div></div>
  <div class="pan"><div class="pt">+ Registrar gasto</div>
    <div class="cg">${VCATS.map(c=>`<button class="cbt ${S.dailyCat===c.id?"on":"off"}" onclick="S.dailyCat='${c.id}';render()"><span class="em">${c.e}</span>${c.l}</button>`).join("")}</div>
    <input class="fi" type="text" placeholder="Descripción (opcional)..." value="${S.dailyDesc}" oninput="S.dailyDesc=this.value">
    <div class="g2f">
      <input class="fi" style="margin-bottom:0" type="number" placeholder="Monto $" value="${S.dailyAmt}" oninput="S.dailyAmt=this.value">
      <input class="fi" style="margin-bottom:0" type="date" value="${S.dailyDate}" oninput="S.dailyDate=this.value">
    </div>
    ${S.dailyCat==="dolares"?`<input class="fi" style="border:1px solid #ffd580;color:#ffd580;margin-top:6px" type="number" placeholder="Cantidad de dólares (USD)..." value="${S.dailyUSD}" oninput="S.dailyUSD=this.value">`:""}
    <button class="btn btn-ye" style="margin-top:8px" onclick="addDaily()">Registrar</button>
  </div>
  ${ct.length?`<div class="pan"><div class="pt">Por categoría</div>${ct.map(c=>`<div class="csr"><span class="csl">${c.e} ${c.l}</span><span class="csv">${fmt(c.tot)}</span></div>`).join("")}</div>`:""}
  <div class="fb">
    <button class="fbt ${S.dailyFilter==="all"?"on":"off"}" onclick="S.dailyFilter='all';render()">Todos</button>
    ${used.map(c=>`<button class="fbt ${S.dailyFilter===c.id?"on":"off"}" onclick="S.dailyFilter='${c.id}';render()">${c.e} ${c.l}</button>`).join("")}
  </div>
  ${!list.length?`<div class="empty">No hay gastos registrados</div>`:list.map(e=>{
    const cat=VCATS.find(c=>c.id===e.category)||{e:"📦",l:"Otro"};
    return `<div class="txi">
      <div>
        <div class="tt">${cat.e} ${cat.l}</div>
        ${e.desc?`<div class="td" style="color:#a8a4c0;">${e.desc}</div>`:""}
        <div class="td">${e.usd?`USD ${e.usd.toLocaleString("es-AR")} · `:""}${fmtD(e.date)}</div>
      </div>
      <div class="txr"><div class="ta" style="color:#ffd580;">${fmt(e.amount)}</div><button class="del" onclick="delDaily(${e.id})">✕</button></div>
    </div>`;
  }).join("")}
  <div class="tbar"><span class="tl">Total Variables</span><span class="tv" style="color:#ffd580">${fmt(t.tv)}</span></div>`;
}
function addDaily(){
  if(!S.dailyAmt)return;
  const e={id:Date.now(),category:S.dailyCat,amount:parseFloat(S.dailyAmt),date:S.dailyDate,desc:S.dailyDesc.trim()};
  if(S.dailyCat==="dolares"&&S.dailyUSD)e.usd=parseFloat(S.dailyUSD);
  S.data.dailyExpenses.push(e);S.dailyAmt="";S.dailyDesc="";S.dailyUSD="";save();render();
}
function delDaily(id){S.data.dailyExpenses=S.data.dailyExpenses.filter(e=>e.id!==id);save();render();}

  <div class="ir"><div class="il">Sueldo</div><div class="ir-r"><span class="sym">$</span><input class="inum" type="number" placeholder="0" value="${S.data.sueldo||""}" oninput="S.data.sueldo=this.value;save()"></div></div>
  <div class="gt">Ingresos Variables</div>

function addIncome(){if(!S.nIamt||!S.nIdesc)return;S.data.varIncomeTransactions.push({id:Date.now(),category:S.nIcat,desc:S.nIdesc,amount:parseFloat(S.nIamt),date:S.nIdate});S.nIdesc="";S.nIamt="";save();render();}
function delIncome(id){S.data.varIncomeTransactions=S.data.varIncomeTransactions.filter(t=>t.id!==id);save();render();}

      <button onclick="S.empType='expense';render()" style="background:${S.empType==="expense"?"#2b0d0d":"#1e1e3a"};color:${S.empType==="expense"?"#ff8c8c":"#6c6c8a"};">Gasto</button>

function delEmpTx(id){S.data.empTransactions=S.data.empTransactions.filter(t=>t.id!==id);save();render();}

// ── ANUAL ──
function anualTab(){
  const md=MONTHS.map((label,i)=>{
    const d=load(i,S.year);
    const t=tots(d);
    return{label:label.slice(0,3),i,ti:t.ti,te:t.te,bl:t.bl,empty:t.ti===0&&t.te===0};
  });
  const tiA=md.reduce((a,m)=>a+m.ti,0);
  const teA=md.reduce((a,m)=>a+m.te,0);
  const blA=tiA-teA;
  const maxV=Math.max(...md.map(m=>Math.max(Math.abs(m.bl),m.ti,m.te)),1);

  return `
  <div class="sh"><div class="sh-t">📈 Resumen ${S.year}</div></div>
  <div class="g2">
    ${cd("Ingresos del año",fmt(tiA),"#7fffb0","#0d2020")}
    ${cd("Gastos del año",fmt(teA),"#ff8c8c","#1a0d0d")}
  </div>
  <div style="background:${blA>=0?"linear-gradient(135deg,#0d2b1e,#1a4a2e)":"linear-gradient(135deg,#2b0d0d,#4a1a1a)"};border:1px solid ${blA>=0?"#2a6a4a":"#6a2a2a"};border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:13px;color:#8a8aaa;font-family:sans-serif;">Balance anual</span>
    <span style="font-size:24px;font-weight:bold;color:${blA>=0?"#7fffb0":"#ff8080"};">${fmt(blA)}</span>
  </div>
  <div class="pan">
    <div class="pt">Mes a mes</div>
    <div style="display:flex;align-items:flex-end;gap:5px;height:110px;margin-bottom:8px;">
      ${md.map(m=>{
        const h=m.empty?0:Math.max(Math.abs(m.bl)/maxV*100,3);
        const col=m.empty?"#2a2a4a":m.bl>=0?"#7fffb0":"#ff8080";
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;" onclick="S.month=${m.i};S.data=load();S.tab='dashboard';render()">
          <div style="width:100%;border-radius:4px;background:${col};height:${h.toFixed(1)}%;opacity:${m.i===S.month?1:0.55};outline:${m.i===S.month?"2px solid #c9b8ff":"none"};"></div>
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:5px;">
      ${md.map(m=>`<div style="flex:1;text-align:center;font-size:9px;color:${m.i===S.month?"#c9b8ff":"#5a5a7a"};font-family:sans-serif;cursor:pointer;font-weight:${m.i===S.month?700:400};" onclick="S.month=${m.i};S.data=load();S.tab='dashboard';render()">${m.label}</div>`).join("")}
    </div>
    <div style="font-size:11px;color:#5a5a7a;text-align:center;margin-top:10px;font-family:sans-serif;">Tocá un mes para ver el detalle</div>
  </div>
  <div class="pan">
    <div class="pt">Detalle mensual</div>
    <div style="display:flex;justify-content:flex-end;gap:14px;margin-bottom:8px;">
      <div style="font-size:10px;color:#7fffb0;font-family:sans-serif;">● Ingresos</div>
      <div style="font-size:10px;color:#ff8c8c;font-family:sans-serif;">● Gastos</div>
      <div style="font-size:10px;color:#c9b8ff;font-family:sans-serif;">● Balance</div>
    </div>
    ${md.map(m=>`
      <div onclick="S.month=${m.i};S.data=load();S.tab='dashboard';render()" style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a1a2e;cursor:pointer;opacity:${m.empty?0.3:1};">
        <div style="font-size:13px;color:${m.i===S.month?"#c9b8ff":"#c8c4d0"};font-family:sans-serif;font-weight:${m.i===S.month?700:400};min-width:36px;">${m.label}</div>
        ${m.empty?`<div style="font-size:11px;color:#3a3a5a;font-family:sans-serif;">sin datos</div>`:`
        <div style="display:flex;gap:12px;align-items:center;">
          <div style="font-size:11px;color:#7fffb0;font-family:sans-serif;">${fmt(m.ti)}</div>
          <div style="font-size:11px;color:#ff8c8c;font-family:sans-serif;">${fmt(m.te)}</div>
          <div style="font-size:13px;font-weight:bold;color:${m.bl>=0?"#7fffb0":"#ff8080"};min-width:65px;text-align:right;">${fmt(m.bl)}</div>
        </div>`}
      </div>`).join("")}
  </div>`;
}

// ── INIT ──
S.data=load();
render();
</script>
